name: Translate the site (Claude API)

# Actions -> "Translate the site" -> Run workflow.
# Interface text and the landing pages are always brought up to date; "games" says how many
# game pages to add on top (Search Console pages first). Running it again adds more.
on:
  schedule:
    - cron: '41 1 * * *'   # every day 02:41 Belgrade: 150 more game pages per language (~5.4 USD a night)
  workflow_dispatch:
    inputs:
      langs:
        description: 'Language codes, comma separated (es,pt,de,fr,zh)'
        default: 'es,pt,de,fr,zh'
        required: true
      games:
        description: 'Game pages per language this run'
        default: '150'
        required: true
      conc:
        description: 'Parallel requests to the Claude API'
        default: '6'
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh game feeds
        run: node scripts/fetch-feeds.mjs
        env:
          GD_FEED_URL: ${{ secrets.GD_FEED_URL }}
      - name: Build (writes .cache for the translator)
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
          CNAME: ${{ vars.CNAME }}
      - name: Translate
        timeout-minutes: 300
        run: |
          # on the daily schedule there are no inputs, so fall back to the standing values
          LANGS="${{ inputs.langs }}"; [ -z "$LANGS" ] && LANGS="es,pt,de,fr,zh"
          GAMES="${{ inputs.games }}"; [ -z "$GAMES" ] && GAMES="150"
          echo "langs=$LANGS games=$GAMES"
          for lang in $(echo "$LANGS" | tr ',' ' '); do
            echo "::group::$lang"
            node scripts/translate.mjs "$lang" "$GAMES" 2>&1 | tee -a /tmp/translate.log || echo "$lang failed, continuing"
            echo "::endgroup::"
          done
          # what this pass cost, so it can be read later without digging through the logs
          read USD IN OUT <<< "$(grep -oE 'tokens: input [0-9]+, output [0-9]+' /tmp/translate.log \
            | awk '{i+=$3; o+=$5} END {printf "%.2f %d %d", i/1000000*1 + o/1000000*5, i, o}')"
          echo "$(date -u +%Y-%m-%d) langs=$LANGS pages_per_lang=$GAMES usd=$USD in=$IN out=$OUT" >> data/i18n/cost.log
          echo "### Translation pass: \$$USD (langs $LANGS, $GAMES pages each)" >> $GITHUB_STEP_SUMMARY
          tail -5 data/i18n/cost.log >> $GITHUB_STEP_SUMMARY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ILOVEWEBGAMES }}
          TRANSLATE_CONC: ${{ inputs.conc || '6' }}
      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/i18n
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Translations: more pages (daily pass)"
          git stash --include-untracked || true
          ok=0; for i in 1 2 3; do git pull --rebase && git push && { ok=1; break; }; sleep 5; done
          [ "$ok" = 1 ] || { echo "push failed"; exit 1; }
      - name: Keep a copy of the translations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n
          path: data/i18n
          if-no-files-found: ignore
      - name: Deploy site
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
