name: Translate the site (Claude API)

# Actions -> "Translate the site" -> Run workflow.
# Interface text and the landing pages are always brought up to date; "games" says how many
# game pages to add on top (Search Console pages first). Running it again adds more.
on:
  workflow_dispatch:
    inputs:
      langs:
        description: 'Language codes, comma separated (es,pt,de,fr)'
        default: 'es,pt,de,fr'
        required: true
      games:
        description: 'Game pages per language this run'
        default: '0'
        required: true
      conc:
        description: 'Parallel requests to the Claude API'
        default: '6'
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh game feeds
        run: node scripts/fetch-feeds.mjs
        env:
          GD_FEED_URL: ${{ secrets.GD_FEED_URL }}
      - name: Build (writes .cache for the translator)
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
          CNAME: ${{ vars.CNAME }}
      - name: Translate
        timeout-minutes: 300
        run: |
          for lang in $(echo "${{ inputs.langs }}" | tr ',' ' '); do
            echo "::group::$lang"
            node scripts/translate.mjs "$lang" "${{ inputs.games }}" || echo "$lang failed, continuing"
            echo "::endgroup::"
          done
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ILOVEWEBGAMES }}
          TRANSLATE_CONC: ${{ inputs.conc }}
      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/i18n
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Translations: ${{ inputs.langs }} (+${{ inputs.games }} game pages each)"
          git stash --include-untracked || true
          ok=0; for i in 1 2 3; do git pull --rebase && git push && { ok=1; break; }; sleep 5; done
          [ "$ok" = 1 ] || { echo "push failed"; exit 1; }
      - name: Keep a copy of the translations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n
          path: data/i18n
          if-no-files-found: ignore
      - name: Deploy site
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
