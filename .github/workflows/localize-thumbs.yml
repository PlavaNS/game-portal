name: Localize oversized community covers

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'   # Monday, a few hours before the weekly speed round

permissions:
  contents: write

jobs:
  shrink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save sharp@0.33.5
      - run: node scripts/localize-thumbs.mjs
      - name: Commit the covers we now host
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/community-games.json static/assets/community
          if ! git diff --cached --quiet; then
            git commit -m "Host oversized community covers ourselves (resized)"
            git pull --rebase -X theirs origin main || true
            git push origin HEAD:main
          else
            echo "nothing to do"
          fi
