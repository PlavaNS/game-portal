name: Rewrite game descriptions (Claude API)

# Actions -> "Rewrite game descriptions" -> Run workflow.
# Rewrites the partner-supplied description of each game in our own words (data/rewrites.json).
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'How many games this run'
        default: '1500'
        required: true
      conc:
        description: 'Parallel requests to the Claude API'
        default: '8'
        required: false
      budget:
        description: 'Stop when the estimated cost (USD) passes this'
        default: '10'
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: write-rewrites
  cancel-in-progress: false

jobs:
  rewrites:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh game feeds
        run: node scripts/fetch-feeds.mjs
        env:
          GD_FEED_URL: ${{ secrets.GD_FEED_URL }}
      - name: Build (writes .cache for the writer)
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
          CNAME: ${{ vars.CNAME }}
      - name: Rewrite descriptions
        timeout-minutes: 200
        run: node scripts/write-rewrites.mjs "${{ inputs.count }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ILOVEWEBGAMES }}
          REWRITE_CONC: ${{ inputs.conc }}
          BUDGET_USD: ${{ inputs.budget }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/rewrites.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "SEO: game descriptions rewritten in our own words"
          git stash --include-untracked || true
          ok=0; for i in 1 2 3; do git pull --rebase && git push && { ok=1; break; }; sleep 5; done
          [ "$ok" = 1 ] || { echo "push failed"; exit 1; }
      - name: Keep a copy of the rewrites
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewrites
          path: data/rewrites.json
          if-no-files-found: ignore
      - name: Deploy site
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}


