name: Write game guides (Claude API)

# Runs every day after the daily feed refresh, so every new game gets its guide the same day.
# Manual run: Actions -> "Write game guides" -> Run workflow.
on:
  schedule:
    - cron: '47 12 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many games (Search Console pages first, then most played)'
        default: '200'
        required: true
      conc:
        description: 'Parallel requests to the Claude API'
        default: '4'
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: write-guides
  cancel-in-progress: false

jobs:
  guides:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh game feeds
        run: node scripts/fetch-feeds.mjs
        env:
          GD_FEED_URL: ${{ secrets.GD_FEED_URL }}
      - name: Build game index
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
          CNAME: ${{ vars.CNAME }}
      - name: Write guides
        run: node scripts/write-guides.mjs "${{ inputs.count || '150' }}"
        timeout-minutes: 300
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ILOVEWEBGAMES }}
          GUIDE_CONC: ${{ inputs.conc || '4' }}
      - name: Commit guides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/guides.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "SEO: Claude-written guides for new games"
          git stash --include-untracked || true
          ok=0; for i in 1 2 3; do git pull --rebase && git push && { ok=1; break; }; sleep 5; done
          [ "$ok" = 1 ] || { echo "push failed"; exit 1; }
      - name: Keep a copy of the guides
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guides
          path: data/guides.json
          if-no-files-found: ignore
      - name: Deploy site
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
