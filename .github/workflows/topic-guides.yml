name: Write collection page guides (Claude API)

# Actions -> "Write collection page guides" -> Run workflow.
# Gives every topic landing page its own "Where to start" picks and FAQ.
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'How many collection pages this run'
        default: '200'
        required: true
      conc:
        description: 'Parallel requests to the Claude API'
        default: '4'
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: topic-guides
  cancel-in-progress: false

jobs:
  topics:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh game feeds
        run: node scripts/fetch-feeds.mjs
        env:
          GD_FEED_URL: ${{ secrets.GD_FEED_URL }}
      - name: Build (writes .cache for the writer)
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
          CNAME: ${{ vars.CNAME }}
      - name: Write collection guides
        timeout-minutes: 90
        run: node scripts/write-topic-guides.mjs "${{ inputs.count }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ILOVEWEBGAMES }}
          TOPIC_CONC: ${{ inputs.conc }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/topic-guides.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "SEO: Claude-written picks and FAQ for collection pages"
          git stash --include-untracked || true
          ok=0; for i in 1 2 3; do git pull --rebase && git push && { ok=1; break; }; sleep 5; done
          [ "$ok" = 1 ] || { echo "push failed"; exit 1; }
      - name: Deploy site
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
