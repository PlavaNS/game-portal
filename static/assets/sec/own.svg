<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- Door frame (outer) -->
  <rect x="22" y="18" width="116" height="130" rx="8" fill="#ffffff" opacity="0.25"/>
  <!-- Door panel (inner) -->
  <rect x="32" y="28" width="96" height="110" rx="6" fill="#03637a"/>
  <!-- Door inner panel top -->
  <rect x="42" y="36" width="76" height="44" rx="4" fill="#0a8ba8" opacity="0.7"/>
  <!-- Door inner panel bottom -->
  <rect x="42" y="88" width="76" height="42" rx="4" fill="#0a8ba8" opacity="0.7"/>
  <!-- Door handle -->
  <circle cx="104" cy="109" r="8" fill="#ffffff" opacity="0.9"/>
  <circle cx="104" cy="109" r="5" fill="#03637a"/>
  <!-- 404 text -->
  <text x="80" y="62" font-family="Arial Black,Arial,sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">404</text>
  <!-- Door base shadow -->
  <rect x="18" y="148" width="124" height="6" rx="3" fill="#000000" opacity="0.3"/>
