<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#03050a" />
<title>Bubble Wrap</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<style>
/* Layout: full-bleed WebGL hex globe; a thin glass HUD on top; a collapsible upgrade drawer at the bottom.
   Look: deep-space instrument panel — hairline frames, cold cyan light, colour only where it means weight. */
[hidden] { display: none !important; }
:root {
  color-scheme: dark;
  --space: #03050a;
  --glass: rgba(9, 13, 22, .78);
  --glass-hi: rgba(18, 26, 42, .92);
  --line: rgba(170, 205, 255, .16);
  --line-hi: rgba(170, 205, 255, .34);
  --ink: #e6eefc;
  --ink-dim: #7f8ca5;
  --cyan: #4fd8ef;
  --cyan-deep: #0f6d80;
  --gold: #f5c04e;
  --green: #5ee08c;
  --red: #ff4d5e;
  --rage: #ff3b5c;
  --display: 'Exo 2', 'Segoe UI', system-ui, sans-serif;
  --sat: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px));
  --sab: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
  --sal: max(env(safe-area-inset-left, 0px), var(--safe-area-inset-left, 0px));
  --sar: max(env(safe-area-inset-right, 0px), var(--safe-area-inset-right, 0px));
  --deck-h: 196px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--space); color: var(--ink); font-family: var(--display); user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
button { font-family: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }
#stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

/* ---------- HUD ---------- */
#hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(var(--sat) + 10px) max(14px, var(--sar)) 0 max(14px, var(--sal)); pointer-events: none; z-index: 5; }
.hud-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.lvlbox { flex: 1; min-width: 0; max-width: 300px; }
#lvl { font: 600 11px/1 var(--display); letter-spacing: .22em; text-transform: uppercase; color: var(--ink-dim); display: flex; align-items: baseline; gap: 8px; }
#lvl b { font: 300 26px/1 var(--display); letter-spacing: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 3px; background: rgba(170, 205, 255, .14); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); border-radius: 2px; transition: width .2s linear; }
.wallet { text-align: right; }
#money { font: 300 30px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
#money .tri { font-size: 15px; margin-left: 4px; vertical-align: 5px; }
.tri { color: var(--gold); }
.popped { margin-top: 5px; font: 600 10px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.popped span { color: var(--ink); }
.hud-row2 { margin-top: 12px; display: flex; align-items: center; gap: 8px; }
.icon-btn { pointer-events: auto; width: 36px; height: 36px; border-radius: 9px; background: var(--glass); border: 1px solid var(--line); display: grid; place-items: center; font: 600 16px/1 var(--display); color: var(--ink); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.icon-btn svg { width: 18px; height: 18px; fill: var(--ink); }
#chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
.chip { font: 600 11px/1 var(--display); letter-spacing: .04em; padding: 7px 9px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.rage { border-color: var(--rage); color: #ffd0da; }
.chip.ret { border-color: rgba(245,192,78,.6); color: #ffe6b0; }
#rageBtn { pointer-events: auto; position: relative; width: 42px; height: 42px; flex: none; }
#rageBtn svg { width: 100%; height: 100%; transform: rotate(-90deg); }
#rageBtn .lbl { position: absolute; inset: 0; display: grid; place-items: center; font: 700 8px/1 var(--display); letter-spacing: .12em; color: var(--ink-dim); }
#rageBtn.active .lbl { color: #fff; }
#rageBtn.active { animation: throb .5s ease-in-out infinite alternate; }
@keyframes throb { to { transform: scale(1.12); } }

#support { pointer-events: auto; position: fixed; left: 50%; top: calc(var(--sat) + 112px); transform: translateX(-50%); z-index: 6; padding: 10px 18px 9px; border-radius: 12px; background: rgba(8, 40, 24, .9); border: 1px solid var(--green); color: #d9ffe8; font: 700 15px/1.1 var(--display); letter-spacing: .16em; box-shadow: 0 0 24px rgba(94,224,140,.35); animation: bob 1.2s ease-in-out infinite alternate; text-align: center; }
#support small { display: block; font-size: 10px; font-weight: 600; letter-spacing: .08em; opacity: .8; margin-top: 4px; }
@keyframes bob { to { transform: translateX(-50%) translateY(-5px); } }
#coreBar { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--sat) + 104px); width: min(64vw, 300px); z-index: 4; pointer-events: none; text-align: center; }
#coreBar .lbl { font: 700 10px/1 var(--display); letter-spacing: .32em; color: #cfe0ff; text-shadow: 0 0 10px #6fa8ff; }
#coreBar .bar > i { background: #cfe0ff; box-shadow: 0 0 10px #6fa8ff; transition: none; }

/* ---------- floating numbers ---------- */
#floaters { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
.fl { position: absolute; left: 0; top: 0; font: 700 14px/1 var(--display); color: var(--gold); text-shadow: 0 1px 6px rgba(0,0,0,.9); white-space: nowrap; will-change: transform, opacity; }
.fl.big { font-size: 26px; font-weight: 300; color: #fff; text-shadow: 0 0 18px #6fa8ff; }

/* ---------- upgrade drawer ---------- */
#deck { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding-bottom: calc(var(--sab) + 6px); background: linear-gradient(180deg, rgba(3,5,10,0), rgba(3,5,10,.86) 26px, rgba(5,8,15,.96)); transition: transform .28s cubic-bezier(.3,.7,.2,1); }
#deck.collapsed { transform: translateY(calc(100% - 44px - var(--sab))); }
.deck-head { display: flex; align-items: center; gap: 4px; padding: 6px max(10px, var(--sar)) 0 max(10px, var(--sal)); max-width: 760px; margin-inline: auto; border-bottom: 1px solid var(--line); }
#tabs { display: flex; flex: 1; gap: 2px; }
#tabs button { flex: 1; position: relative; padding: 10px 4px 12px; font: 600 11px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-dim); }
#tabs button[aria-selected="true"] { color: var(--ink); }
#tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: -1px; height: 2px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
#tabs .badge { display: inline-block; min-width: 15px; padding: 2px 4px; margin-left: 5px; border-radius: 99px; background: var(--cyan); color: #032029; font-size: 9px; letter-spacing: 0; vertical-align: 1px; }
#deckToggle { width: 38px; height: 34px; display: grid; place-items: center; border-radius: 9px; color: var(--ink-dim); }
#deckToggle svg { width: 18px; height: 18px; fill: currentColor; transition: transform .25s; }
#deck.collapsed #deckToggle svg { transform: rotate(180deg); }
#cards { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 10px max(10px, var(--sar)) 4px max(10px, var(--sal)); scroll-snap-type: x proximity; touch-action: pan-x; scrollbar-width: none; max-width: 760px; margin-inline: auto; }
#cards { cursor: grab; }
@media (pointer: fine) {
  #cards { scroll-snap-type: none; scrollbar-width: thin; scrollbar-color: rgba(170,205,255,.35) transparent; padding-bottom: 8px; }
  #cards::-webkit-scrollbar { height: 6px; }
  #cards::-webkit-scrollbar-thumb { background: rgba(170,205,255,.35); border-radius: 3px; }
}
@media (pointer: coarse) { #cards::-webkit-scrollbar { display: none; } }
.card { flex: none; width: 112px; border-radius: 10px; background: rgba(170, 205, 255, .04); border: 1px solid var(--line); padding: 7px; display: flex; flex-direction: column; align-items: center; gap: 4px; scroll-snap-align: start; position: relative; }
.card h4 { margin: 0; padding-inline: 14px; font: 600 11px/1.15 var(--display); letter-spacing: .02em; text-align: center; min-height: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.card .ic { width: 50px; height: 50px; display: grid; place-items: center; font-size: 22px; position: relative; isolation: isolate; }
.card .ic::before { content: ""; position: absolute; inset: 0; z-index: -1; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); background: var(--c, var(--cyan)); opacity: .2; }
.card .ic::after { content: ""; position: absolute; inset: 0; z-index: -1; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%, 5% 50%, 28% 92%, 72% 92%, 95% 50%, 72% 8%, 28% 8%, 5% 50%, 0 50%); background: var(--c, var(--cyan)); opacity: .9; }
.card .ic img { display: block; width: 40px; height: 40px; }
.card .meta { font: 500 10px/1.25 var(--display); color: var(--ink-dim); text-align: center; font-variant-numeric: tabular-nums; }
.card .meta b { color: var(--ink); font-weight: 700; }
.card .btns { display: flex; flex-direction: column; gap: 4px; width: 100%; margin-top: auto; }
.buy { width: 100%; border-radius: 7px; padding: 6px 4px; background: var(--cyan); color: #032029; font: 700 11px/1.1 var(--display); display: flex; justify-content: center; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.buy span.k { font-weight: 600; opacity: .75; font-size: 9px; letter-spacing: .1em; }
.buy .tri { color: #6b4b00; font-size: 9px; }
.buy[disabled] { background: transparent; color: var(--ink-dim); box-shadow: inset 0 0 0 1px var(--line); cursor: default; }
.buy[disabled] .tri { color: var(--ink-dim); }
.buy.max { background: transparent; color: var(--ink-dim); box-shadow: none; letter-spacing: .2em; }
.sell { position: absolute; top: 4px; right: 4px; width: 16px; height: 16px; display: grid; place-items: center; font: 600 10px/1 var(--display); color: var(--ink-dim); border-radius: 4px; background: rgba(255,255,255,.06); }
.card.locked { opacity: .55; }
.card.locked .ic img { filter: grayscale(.6); opacity: .8; }
.card.locked .ic { font: 300 22px/1 var(--display); color: var(--ink-dim); }
.card.on { border-color: var(--line-hi); background: rgba(79, 216, 239, .06); }
.lvls { display: flex; gap: 6px; font: 600 9px/1 var(--display); letter-spacing: .06em; color: var(--ink-dim); }
.lvls b { color: var(--ink); }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: calc(var(--sat) + 16px) max(16px, var(--sar)) calc(var(--sab) + 16px) max(16px, var(--sal)); background: rgba(3,5,10,.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); touch-action: pan-y; }
.sheet { width: min(100%, 360px); max-height: 100%; overflow: auto; border-radius: 16px; background: var(--glass-hi); border: 1px solid var(--line-hi); padding: 22px 20px 20px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(79,216,239,.08); }
.sheet.dark { text-align: left; }
.sheet h2 { margin: 0 0 14px; font: 300 26px/1.1 var(--display); letter-spacing: .04em; text-align: center; }
.sheet p { margin: 0 0 10px; font: 500 14px/1.45 var(--display); color: #c9d5ea; }
.sheet .big { font: 300 44px/1 var(--display); margin: 8px 0 10px; color: #fff; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 12px 26px; border-radius: 10px; background: var(--cyan); font: 700 13px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; color: #032029; }
.pill.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-hi); }
.pill.red { background: var(--red); color: #fff; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }

#menu { background: linear-gradient(180deg, rgba(3,5,10,.55) 0, rgba(3,5,10,0) 28%, rgba(3,5,10,0) 55%, rgba(3,5,10,.9) 100%); backdrop-filter: none; -webkit-backdrop-filter: none; place-items: stretch center; }
.menu-inner { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; width: min(100%, 300px); }
#logoBox { padding-top: 4vh; text-align: center; }
.logo { font: 900 clamp(42px, 13vw, 68px)/.88 var(--display); font-style: italic; letter-spacing: -.01em; color: #f4f8ff; text-shadow: 0 0 28px rgba(111,168,255,.45); }
.logo span { display: block; color: var(--cyan); }
.tag { margin-top: 12px; font: 600 10px/1.3 var(--display); letter-spacing: .4em; text-transform: uppercase; color: var(--ink-dim); }
#menuBtns { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.mbtn { width: 100%; padding: 14px 18px; border-radius: 10px; background: var(--glass); border: 1px solid var(--line); font: 600 13px/1 var(--display); letter-spacing: .24em; text-transform: uppercase; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.mbtn.primary { background: var(--cyan); border-color: var(--cyan); color: #032029; box-shadow: 0 0 24px rgba(79,216,239,.3); }
.menu-foot { margin-top: 6px; font: 500 11px/1.4 var(--display); letter-spacing: .06em; color: var(--ink-dim); text-align: center; }

.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font: 600 14px/1.2 var(--display); }
.set-row:last-of-type { border-bottom: 0; }
.toggle { width: 48px; height: 26px; border-radius: 99px; background: rgba(170,205,255,.14); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #8d99b3; transition: transform .15s; }
.toggle[aria-checked="true"] { background: var(--cyan-deep); }
.toggle[aria-checked="true"]::after { transform: translateX(22px); background: var(--cyan); }
.seg { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid var(--line-hi); }
.seg button { padding: 7px 12px; font: 600 12px/1 var(--display); color: var(--ink-dim); }
.seg button[aria-pressed="true"] { background: var(--cyan); color: #032029; }
.howto { text-align: left; padding-left: 18px; margin: 0; }
.howto li { margin: 0 0 8px; font: 500 13px/1.45 var(--display); color: #c9d5ea; }
.howto b { color: #fff; }
.weights { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: center; margin: 2px 0 14px; }
.weights span { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--display); color: #c9d5ea; font-variant-numeric: tabular-nums; }
.weights i { width: 13px; height: 12px; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); background: var(--c); }
.credits dt { font: 700 10px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-dim); margin-top: 12px; }
.credits dd { margin: 4px 0 0; font: 500 16px/1.3 var(--display); }

#toast { position: fixed; left: 50%; bottom: calc(var(--sab) + var(--deck-h) + 14px); transform: translateX(-50%); z-index: 30; background: var(--glass-hi); border: 1px solid var(--line-hi); padding: 9px 14px; border-radius: 10px; font: 600 12px/1.25 var(--display); letter-spacing: .04em; pointer-events: none; opacity: 0; transition: opacity .2s; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; }
#rageFlash { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0; box-shadow: inset 0 0 120px 30px rgba(255,59,92,.5); transition: opacity .4s; }
body.rage #rageFlash { opacity: 1; animation: ragepulse .42s ease-in-out infinite alternate; }
@keyframes ragepulse { from { opacity: .55; } to { opacity: 1; } }
#loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--space); font: 600 12px/1 var(--display); letter-spacing: .4em; color: var(--ink-dim); }

#achBtn { position: relative; }
#achBtn[data-n]:not([data-n=""])::after { content: attr(data-n); position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--gold); color: #2a1d00; font: 700 10px/16px var(--display); text-align: center; }
.streak { display: flex; justify-content: center; gap: 6px; margin: 0 0 12px; }
.streak i { width: 28px; height: 26px; display: grid; place-items: center; font: 700 11px/1 var(--display); font-style: normal; color: var(--ink-dim); clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); background: rgba(170,205,255,.12); }
.streak i.on { background: var(--gold); color: #2a1d00; }
.achs { display: flex; flex-direction: column; gap: 8px; max-height: 56vh; overflow-y: auto; padding-right: 2px; touch-action: pan-y; }
.ach { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(170,205,255,.04); }
.ach.done { opacity: .55; }
.ach-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ach-txt b { font: 600 13px/1.2 var(--display); }
.ach-txt span { font: 500 11px/1.3 var(--display); color: var(--ink-dim); }
.ach-txt .bar { margin-top: 3px; }
.ach .buy { width: auto; min-width: 74px; padding: 7px 10px; flex: none; }
.ach em { font: 600 11px/1 var(--display); font-style: normal; letter-spacing: .14em; text-transform: uppercase; color: var(--green); }
.buy.adbtn { background: transparent; color: var(--gold); box-shadow: inset 0 0 0 1px rgba(245,192,78,.55); }
.buy.adbtn[disabled] { color: var(--ink-dim); box-shadow: inset 0 0 0 1px var(--line); }
#hint { position: fixed; left: 0; top: 0; z-index: 15; pointer-events: none; padding: 10px 14px; border-radius: 10px; background: var(--cyan); color: #032029; font: 700 13px/1.3 var(--display); text-align: center; box-shadow: 0 0 30px rgba(79,216,239,.45); animation: hintbob 1s ease-in-out infinite alternate; }
#hint[data-arrow="down"]::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px; background: var(--cyan); transform: translateX(-50%) rotate(45deg); }
@keyframes hintbob { to { margin-top: -6px; } }
.adph { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: #000; }
.adph-box { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.adph-tag { font: 700 10px/1 var(--display); letter-spacing: .3em; color: var(--gold); }
.adph-title { font: 300 28px/1 var(--display); }
.adph-sub { font: 500 13px/1.3 var(--display); color: var(--ink-dim); }
.adph-count { font: 300 64px/1 var(--display); color: var(--cyan); }

@media (min-width: 720px) {
  .card { width: 124px; }
  #cards { justify-content: safe center; }
}
@media (max-height: 480px) and (orientation: landscape) {
  /* short landscape screens (phones sideways, small iframes): compact deck so the globe stays visible */
  #tabs button { padding: 6px 4px 7px; font-size: 10px; }
  #cards { padding-top: 5px; gap: 6px; }
  .card { width: 92px; padding: 4px 5px; gap: 2px; }
  .card h4 { font-size: 10px; }
  .card .ic { width: 34px; height: 34px; }
  .card .ic img { width: 27px; height: 27px; }
  .card .meta { font-size: 9px; line-height: 1.15; }
  #lvl b { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  #support, #rageBtn.active, body.rage #rageFlash { animation: none; }
  #deck { transition: none; }
}
